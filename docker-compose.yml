# Jovi Core v0.1
#   docker compose up --build
#
# LM Studio (Jovi's only local-model runtime) runs on the host, not in a container:
# start its local server (Developer → Start Server, or `lms server start`) and load a model.
# The container reaches it through host.docker.internal.
services:
  jovi-core:
    build:
      context: .
      dockerfile: docker/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: data/jovi.db
      LM_STUDIO_URL: ${LM_STUDIO_URL_DOCKER:-http://host.docker.internal:1234/v1}
      # The API binds 0.0.0.0 inside the container; the published port below is
      # loopback-only. Authentication is always required: on first start the API
      # prints an owner token once (see `docker compose logs jovi-core`), or set a
      # ≥32-char JOVI_API_TOKEN in .env. Other containers must be added to
      # JOVI_ALLOWED_HOSTS (by service name) to be answered at all.
      JOVI_ALLOW_NETWORK_BIND: "true"
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - 127.0.0.1:3000:3000
    volumes:
      - ./data:/app/data
    restart: unless-stopped
