# Security remediation R-07: continuous integration with least privilege.
# - Every third-party action is pinned to a full commit SHA (tag in the comment).
# - Downloaded scanners are pinned to a version and verified against a SHA-256.
# - The workflow token is read-only; no job can write to the repository.
name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
  OSV_SCANNER_VERSION: 2.6.0
  OSV_SCANNER_SHA256: ca69b3d3cd08f889a49dc0a383122f71cc528b83803671df5fd874d97485b108

jobs:
  build-test:
    name: Typecheck, test, build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  dependencies:
    name: Dependency audit + SBOM
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci --ignore-scripts
      - name: npm audit (runtime dependencies, any severity fails)
        run: npm audit --omit=dev --audit-level=low
      - name: npm audit (full tree, high or critical fails)
        run: npm audit --audit-level=high
      - name: Install osv-scanner (checksum-verified)
        run: |
          curl -sSfL -o osv-scanner "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SCANNER_SHA256}  osv-scanner" | sha256sum -c -
          chmod +x osv-scanner
      - name: osv-scanner (lockfile; accepted advisories in osv-scanner.toml)
        run: ./osv-scanner scan source --lockfile=package-lock.json --config=osv-scanner.toml
      - name: SBOM (CycloneDX, runtime dependencies)
        run: npm sbom --omit=dev --sbom-format=cyclonedx > sbom-runtime.cdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-runtime-cdx
          path: sbom-runtime.cdx.json
          retention-days: 90

  secrets:
    name: Secret scan (gitleaks, full history)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (checksum-verified)
        run: |
          curl -sSfL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
      - name: gitleaks (git history)
        run: ./gitleaks git . --redact --no-banner --config .gitleaks.toml

  container:
    name: Container (hardened compose)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the image (digest-pinned base)
        run: docker compose build
      - name: Start with the compose hardening (read-only root, no capabilities, limits)
        run: |
          mkdir -p data && sudo chown 1000:1000 data
          docker compose up -d
      - name: Wait for /health
        run: |
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:3000/health; then exit 0; fi
            sleep 2
          done
          docker compose logs jovi-core | sed -E 's/jovi_[A-Za-z0-9_-]{43}/jovi_<redacted>/g'
          exit 1
      - name: Verify the hardening is in effect
        run: |
          id="$(docker compose ps -q jovi-core)"
          docker inspect "$id" --format 'readonly={{.HostConfig.ReadonlyRootfs}} capdrop={{.HostConfig.CapDrop}} secopt={{.HostConfig.SecurityOpt}} memory={{.HostConfig.Memory}} pids={{.HostConfig.PidsLimit}} user={{.Config.User}}'
          test "$(docker inspect "$id" --format '{{.HostConfig.ReadonlyRootfs}}')" = "true"
          docker inspect "$id" --format '{{.HostConfig.CapDrop}}' | grep -q ALL
          docker inspect "$id" --format '{{.HostConfig.SecurityOpt}}' | grep -q 'no-new-privileges:true'
          test "$(docker inspect "$id" --format '{{.Config.User}}')" = "node"
          if docker compose exec -T jovi-core sh -c 'touch /app/probe' 2>/dev/null; then echo "root filesystem is writable"; exit 1; fi
          docker compose exec -T jovi-core sh -c 'touch /app/data/probe && rm /app/data/probe'
          docker compose exec -T jovi-core sh -c 'stat -c "%a %n" /app/data /app/data/jovi.db'
          test "$(docker compose exec -T jovi-core stat -c %a /app/data/jovi.db)" = "600"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/api/status)" = "401"
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'host: evil.example' http://127.0.0.1:3000/health)" = "403"
          docker compose logs jovi-core | grep -q 'OWNER credential was created'
      - name: Stop
        if: always()
        run: docker compose down -v
